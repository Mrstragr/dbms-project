{% extends "base.html" %}

{% block title %}Add Equipment - SAU Lab Management{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-plus me-2"></i>Add New Equipment</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="equipment_name" class="form-label">Equipment Name</label>
                        <input type="text" class="form-control" id="equipment_name" name="equipment_name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="equipment_type" class="form-label">Equipment Type</label>
                        <select class="form-select" id="equipment_type" name="equipment_type" required>
                            <option value="">Select Type</option>
                            <option value="laptop">Laptop</option>
                            <option value="projector">Projector</option>
                            <option value="oscilloscope">Oscilloscope</option>
                            <option value="multimeter">Multimeter</option>
                            <option value="power_supply">Power Supply</option>
                            <option value="microscope">Microscope</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" required>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('admin_equipment') }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Add Equipment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
