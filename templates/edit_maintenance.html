{% extends "base.html" %}

{% block title %}Edit Maintenance Record{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-edit me-2"></i>Edit Maintenance Record</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label for="equipment_id" class="form-label">Equipment</label>
                        <select class="form-select" id="equipment_id" name="equipment_id" required disabled>
                            {% for eq in equipment %}
                            <option value="{{ eq.equipment_id }}" {% if eq.equipment_id == maintenance.equipment_id %}selected{% endif %}>
                                {{ eq.equipment_name }}
                            </option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Equipment cannot be changed after creation</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="maintenance_type" class="form-label">Maintenance Type</label>
                        <select class="form-select" id="maintenance_type" name="maintenance_type" required>
                            <option value="routine" {% if maintenance.maintenance_type == 'routine' %}selected{% endif %}>Routine Maintenance</option>
                            <option value="repair" {% if maintenance.maintenance_type == 'repair' %}selected{% endif %}>Repair</option>
                            <option value="upgrade" {% if maintenance.maintenance_type == 'upgrade' %}selected{% endif %}>Upgrade</option>
                            <option value="calibration" {% if maintenance.maintenance_type == 'calibration' %}selected{% endif %}>Calibration</option>
                            <option value="cleaning" {% if maintenance.maintenance_type == 'cleaning' %}selected{% endif %}>Cleaning</option>
                            <option value="other" {% if maintenance.maintenance_type == 'other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" required>{{ maintenance.description }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="cost" class="form-label">Cost ($)</label>
                        <input type="number" class="form-control" id="cost" name="cost" 
                               step="0.01" min="0" value="{{ maintenance.cost or 0 }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="pending" {% if maintenance.status == 'pending' %}selected{% endif %}>Pending</option>
                            <option value="in_progress" {% if maintenance.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                            <option value="completed" {% if maintenance.status == 'completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('maintenance') }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Update Maintenance Record
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
