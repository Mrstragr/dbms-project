{% extends "base.html" %}

{% block title %}Login - SAU Lab Management{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <div class="auth-icon"><i class="fas fa-flask"></i></div>
                <h1 class="auth-title">Welcome back</h1>
                <p class="text-muted mb-0">Sign in to SAU Lab Resource Management</p>
            </div>

            <ul class="nav nav-pills nav-fill auth-tabs mb-4" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pane-student" type="button" role="tab" aria-controls="pane-student" aria-selected="true">
                        <i class="fas fa-user-graduate me-1"></i>Student
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pane-faculty" type="button" role="tab" aria-controls="pane-faculty" aria-selected="false">
                        <i class="fas fa-chalkboard-teacher me-1"></i>Faculty
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pane-admin" type="button" role="tab" aria-controls="pane-admin" aria-selected="false">
                        <i class="fas fa-crown me-1"></i>Admin
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Student Login -->
                <div class="tab-pane fade show active" id="pane-student" role="tabpanel">
                    <form method="POST" class="student-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="role" value="student">
                        <div class="mb-3">
                            <label for="student_email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="student_email" name="email" placeholder="student@sau.edu" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="student_password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="student_password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i>Login as Student
                            </button>
                        </div>
                    </form>
                    <p class="auth-footer">
                        New student?
                        <a href="{{ url_for('signup') }}">Register here</a>
                    </p>
                </div>

                <!-- Faculty Login -->
                <div class="tab-pane fade" id="pane-faculty" role="tabpanel">
                    <form method="POST" class="faculty-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="role" value="faculty">
                        <div class="mb-3">
                            <label for="faculty_email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="faculty_email" name="email" placeholder="faculty@sau.edu" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="faculty_password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="faculty_password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i>Login as Faculty
                            </button>
                        </div>
                    </form>
                    <p class="auth-footer">
                        New faculty?
                        <a href="{{ url_for('signup') }}">Register here</a>
                    </p>
                </div>

                <!-- Admin Login -->
                <div class="tab-pane fade" id="pane-admin" role="tabpanel">
                    <form method="POST" class="admin-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="role" value="admin">
                        <div class="mb-3">
                            <label for="admin_email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="admin_email" name="email" placeholder="admin@sau.edu" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="admin_password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="admin_password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i>Login as Admin
                            </button>
                        </div>
                    </form>
                    <p class="auth-footer">
                        <i class="fas fa-shield-halved me-1"></i>Authorized personnel only
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
