{% extends "base.html" %}

{% block title %}Sign Up - SAU Lab Management{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
                <h1 class="auth-title">Create your account</h1>
                <p class="text-muted mb-0">Join SAU Lab Resource Management</p>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@sau.edu" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="role" class="form-label">Role</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-id-badge"></i></span>
                        <select class="form-select" id="role" name="role" required>
                            <option value="">Select Role</option>
                            <option value="student">Student</option>
                            <option value="lab_assistant">Lab Assistant</option>
                            <option value="faculty">Faculty</option>
                        </select>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus me-2"></i>Sign Up
                    </button>
                </div>
            </form>
            <p class="auth-footer">
                Already have an account?
                <a href="{{ url_for('login') }}"><i class="fas fa-sign-in-alt me-1"></i>Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
